name: test

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  install-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/ci_fake_install.py make
      - run: bash install.sh
      - run: python3 tests/ci_fake_install.py check
      - if: always()
        run: cat ~/.claude-session-sync/sync.log || true
      - run: bash ~/.claude-session-sync/install.sh --uninstall
      - run: sleep 3 && ! pgrep -f "claude_session_sync.py --loop"

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/ci_fake_install.py make
      - shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\install.ps1
      - run: python tests/ci_fake_install.py check
      - shell: powershell
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'claude-session-sync.lnk'
          if (-not (Test-Path $lnk)) { throw 'startup shortcut missing' }
      - if: always()
        shell: powershell
        run: Get-Content "$env:USERPROFILE\.claude-session-sync\sync.log" -ErrorAction SilentlyContinue
      - shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Uninstall
          Start-Sleep 3
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*claude_session_sync.py*--loop*' }
          if ($left) { throw 'sync process still running' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'claude-session-sync.lnk'
          if (Test-Path $lnk) { throw 'startup shortcut still there' }
